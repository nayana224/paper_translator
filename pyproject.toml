[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-translator"
version = "1.0.0"
description = "Private academic PDF translation web app powered by Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
]

[project.scripts]
paper-translator-server = "paper_translator.server_main:main"
paper-translator-install-pdfjs = "paper_translator.pdfjs_assets:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_translator = ["web/*.html", "web/*.css", "web/*.js", "web/*.webmanifest"]
